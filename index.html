
<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="google-site-verification" content="mywQzH9AkB0e-FbbOXU1IEX9_D9tLBw8Uug8LeciyIU" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InvoiceAI Pro</title>
<meta name="description" content="InvoiceAI Pro simplifie la gestion de vos factures : suivi des paiements, gestion des clients et organisation de votre activité.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6fc;color:#20243a;font-family:Arial,sans-serif}
header{background:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:23px;font-weight:bold;color:#6555df}
button{border:0;border-radius:9px;padding:12px 16px;cursor:pointer;font-weight:bold;margin:3px}
.primary{background:#6555df;color:white}
.secondary{background:#eeeaff;color:#6555df}
.danger{background:#ffeded;color:#c44}
main{max-width:1050px;margin:30px auto;padding:0 16px}
.auth{max-width:420px;margin:60px auto;background:white;padding:25px;border-radius:15px}
input{display:block;width:100%;padding:12px;margin:8px 0 15px;border:1px solid #ddd;border-radius:8px}
label{font-size:13px;font-weight:bold}
h1{font-size:27px}
.sub{color:#9299aa;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:22px 0}
.card,.panel{background:white;padding:20px;border-radius:14px;margin-bottom:17px}
.card p{color:#9299aa;font-size:13px}
.card strong{font-size:23px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{text-align:left;padding:13px 8px;border-bottom:1px solid #eee;font-size:12px}
th{color:#9299aa}
.wrap{overflow-x:auto}
.hidden{display:none}
.status{font-size:11px;padding:6px 9px;border-radius:15px;background:#fff2d9;color:#a66a00}
.paid{background:#e5f8ed;color:#21834b}
.late{background:#ffe9e9;color:#c44}
#message,#appMessage{font-size:13px;color:#6555df}
@media(max-width:600px){main{margin:20px auto}.card{padding:14px}}
</style>
</head>
<body>

<header>
<div class="logo">InvoiceAI Pro</div>
<button id="logout" class="secondary hidden">Déconnexion</button>
</header>

<section id="auth" class="auth">
<h1>Bienvenue 👋</h1>
<p class="sub">Connecte-toi pour retrouver tes factures.</p>
<label>Email</label>
<input id="email" type="email" placeholder="Ton email">
<label>Mot de passe</label>
<input id="password" type="password" placeholder="Mot de passe">
<button class="primary" id="login">Connexion</button>
<button class="secondary" id="signup">Créer un compte</button>
<p id="message"></p>
</section>

<main id="app" class="hidden">
<div class="top">
<div><h1>Tableau de bord</h1><p class="sub">Gestion de tes factures</p></div>
<button class="primary" id="showForm">+ Nouvelle facture</button>
</div>

<div class="cards">
<div class="card"><p>Factures</p><strong id="count">0</strong></div>
<div class="card"><p>Total payé</p><strong id="paid">0 €</strong></div>
<div class="card"><p>En attente</p><strong id="pending">0 €</strong></div>
<div class="card"><p>En retard</p><strong id="overdue">0 €</strong></div>
</div>

<div class="panel hidden" id="formPanel">
<h3>Nouvelle facture</h3>
<label>Nom du client</label>
<input id="customer" placeholder="Nom du client">
<label>Montant en euros</label>
<input id="amount" type="number" min="0.01" step="0.01" placeholder="850">
<label>Date d'émission</label>
<input id="invoiceDate" type="date">
<label>Date d'échéance</label>
<input id="dueDate" type="date">
<button class="primary" id="add">Enregistrer</button>
<button class="secondary" id="cancel">Annuler</button>
</div>

<div class="panel">
<div class="top"><h3>Mes factures</h3><input id="search" placeholder="Rechercher..." style="max-width:200px"></div>
<div class="wrap">
<table>
<thead><tr><th>Numéro</th><th>Client</th><th>Montant</th><th>Échéance</th><th>Statut</th><th>Actions</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
<p id="empty" class="sub">Aucune facture enregistrée.</p>
<p id="appMessage"></p>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://yoaoocaynhssfyoktfxn.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_R1D6LFxzTdJWnN4MhU5ccg_W0_gqrZ4";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const $=id=>document.getElementById(id);
let invoices=[];

function money(n){
return Number(n).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
}
function today(){
const d=new Date();
return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function safe(s){
return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function loadInvoices(){
$("appMessage").textContent="Chargement...";
const {data,error}=await db.from("invoices").select("*").order("created_at",{ascending:false});
if(error){$("appMessage").textContent="Erreur : "+error.message;return;}
invoices=data||[];
render();
$("appMessage").textContent="";
}

function render(){
const t=today();
const sum=fn=>invoices.filter(fn).reduce((s,x)=>s+Number(x.amount),0);
$("count").textContent=invoices.length;
$("paid").textContent=money(sum(x=>x.status==="paid"));
$("pending").textContent=money(sum(x=>x.status==="pending"&&x.due_date>=t));
$("overdue").textContent=money(sum(x=>x.status==="pending"&&x.due_date<t));

const q=$("search").value.toLowerCase();
const shown=invoices.filter(x=>x.customer.toLowerCase().includes(q));
$("empty").style.display=shown.length?"none":"block";
$("rows").innerHTML=shown.map(x=>{
const late=x.status==="pending"&&x.due_date<t;
return `<tr>
<td>${safe(x.invoice_number)}</td>
<td>${safe(x.customer)}</td>
<td>${money(x.amount)}</td>
<td>${safe(x.due_date)}</td>
<td><span class="status ${x.status==="paid"?"paid":late?"late":""}">${x.status==="paid"?"Payée":late?"En retard":"En attente"}</span></td>
<td>
<button class="secondary" onclick="toggleStatus('${x.id}','${x.status}')">${x.status==="paid"?"En attente":"Payée"}</button>
<button class="danger" onclick="removeInvoice('${x.id}')">×</button>
</td></tr>`;
}).join("");
}

async function addInvoice(){
const customer=$("customer").value.trim();
const amount=Number($("amount").value);
const invoiceDate=$("invoiceDate").value;
const dueDate=$("dueDate").value;
if(!customer||!amount||amount<=0||!invoiceDate||!dueDate){
$("appMessage").textContent="Remplis tous les champs.";
return;
}
if(dueDate<invoiceDate){
$("appMessage").textContent="La date d'échéance doit être après la date d'émission.";
return;
}
const {data:{user}}=await db.auth.getUser();
if(!user)return;
const {error}=await db.from("invoices").insert({
user_id:user.id,
invoice_number:"FAC-"+Date.now(),
customer,
amount,
invoice_date:invoiceDate,
due_date:dueDate,
status:"pending"
});
if(error){$("appMessage").textContent=error.message;return;}
$("customer").value="";
$("amount").value="";
$("formPanel").classList.add("hidden");
await loadInvoices();
}

async function toggleStatus(id,status){
const {error}=await db.from("invoices").update({status:status==="paid"?"pending":"paid"}).eq("id",id);
if(error){$("appMessage").textContent=error.message;return;}
await loadInvoices();
}
async function removeInvoice(id){
if(!confirm("Supprimer cette facture ?"))return;
const {error}=await db.from("invoices").delete().eq("id",id);
if(error){$("appMessage").textContent=error.message;return;}
await loadInvoices();
}

async function enterApp(){
$("auth").classList.add("hidden");
$("app").classList.remove("hidden");
$("logout").classList.remove("hidden");
await loadInvoices();
}

$("login").onclick=async()=>{
$("message").textContent="Connexion...";
const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
if(error){$("message").textContent=error.message;return;}
await enterApp();
};

$("signup").onclick=async()=>{
$("message").textContent="Création du compte...";
const {data,error}=await db.auth.signUp({
  email:$("email").value.trim(),
  password:$("password").value,
  options:{
    emailRedirectTo:"https://rshhr7kktp-crypto.github.io/invoiceai/"
  }
});
if(error){$("message").textContent=error.message;return;}
if(data.session){await enterApp();}
else{$("message").textContent="Compte créé. Vérifie ton email pour confirmer ton inscription.";}
};

$("logout").onclick=async()=>{
await db.auth.signOut();
$("app").classList.add("hidden");
$("auth").classList.remove("hidden");
$("logout").classList.add("hidden");
};
$("showForm").onclick=()=>{
$("formPanel").classList.toggle("hidden");
$("invoiceDate").value=today();
$("dueDate").value=today();
};
$("cancel").onclick=()=>$("formPanel").classList.add("hidden");
$("add").onclick=addInvoice;
$("search").oninput=render;

db.auth.onAuthStateChange((event, session)=>{
if(session && (event==="SIGNED_IN" || event==="INITIAL_SESSION")){
enterApp();
}
if(event==="SIGNED_OUT"){
$("app").classList.add("hidden");
$("auth").classList.remove("hidden");
$("logout").classList.add("hidden");
}
});

db.auth.getSession().then(({data})=>{
if(data.session)enterApp();
});
</script>
</body>
</html>
